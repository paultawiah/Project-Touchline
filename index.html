<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1715" />
  <meta name="description" content="Project Touchline — build your club, shape your tactics, and chase football glory." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/style.css" />
  <title>Project Touchline</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-view="dashboard"><span class="brand-mark">PT</span><span><b>TOUCHLINE</b><small>FOOTBALL DIRECTOR</small></span></a>
      <div class="club-mini"><div class="crest">AL</div><div><strong id="club-name-side">Accra Lions</strong><small id="season-side">Season 2026/27</small></div></div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span>◈</span> Overview</button>
        <button class="nav-item" data-view="squad"><span>♙</span> Squad</button>
        <button class="nav-item" data-view="tactics"><span>⌘</span> Tactics</button>
        <button class="nav-item" data-view="fixtures"><span>▦</span> Fixtures & table</button>
        <button class="nav-item" data-view="match"><span>⚽</span> Match centre</button>
        <button class="nav-item" data-view="club"><span>♜</span> Club & finances</button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span> CAREER AUTOSAVE <small>Saved on this device</small></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-brand" data-view="dashboard"><span class="brand-mark">PT</span> TOUCHLINE</button>
        <div class="season-label"><span class="live-dot"></span><span id="top-season">GHANA PREMIER DIVISION · 2026/27</span></div>
        <button class="avatar" title="Manager profile">MT</button>
      </header>
      <div id="app" class="content" aria-live="polite"></div>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="active" data-view="dashboard"><span>◈</span>Home</button><button data-view="squad"><span>♙</span>Squad</button><button data-view="tactics"><span>⌘</span>Tactics</button><button data-view="fixtures"><span>▦</span>League</button><button data-view="club"><span>♜</span>Club</button>
      </nav>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
